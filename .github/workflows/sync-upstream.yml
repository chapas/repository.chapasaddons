name: Sync upstream and publish repository version

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream for new commits
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/a4k-openproject/repository.addons4kodi/commits/master --jq .sha)
          current=$(cat upstream.sha 2>/dev/null || echo "")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish new repository version
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.latest }}
        run: |
          python scripts/bump_addons.py
          echo "$UPSTREAM_SHA" > upstream.sha

      - name: Commit and push
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.latest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync with a4k upstream ${UPSTREAM_SHA:0:7}"
          git push
